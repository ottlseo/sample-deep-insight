<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Insight — Job Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d0f13;
            --bg-surface: #161921;
            --bg-card: #1c2029;
            --bg-elevated: #232833;
            --border: #2a2f3a;
            --border-hover: #3d445a;
            --text-primary: #e8eaf0;
            --text-secondary: #dce0eb;
            --text-muted: #a8b2c8;
            --accent: #4a7cff;
            --accent-glow: rgba(74, 124, 255, 0.15);
            --accent-hover: #6190ff;
            --green: #34d399;
            --green-bg: rgba(52, 211, 153, 0.1);
            --red: #f87171;
            --red-bg: rgba(248, 113, 113, 0.1);
            --amber: #fbbf24;
            --amber-bg: rgba(251, 191, 36, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-display);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .header-title { font-size: 1.2rem; font-weight: 700; }
        .header-badge {
            font-size: 0.75rem;
            color: var(--accent);
            background: var(--accent-glow);
            border: 1px solid rgba(74, 124, 255, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-xs);
        }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .btn-sm {
            padding: 0.4rem 1rem;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-family: var(--font-display);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
        .lang-area { display: flex; align-items: center; gap: 0.5rem; }
        .lang-label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; }
        .lang-toggle {
            padding: 0.35rem 0.9rem;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(74, 124, 255, 0.3);
            border-radius: var(--radius-xs);
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-toggle:hover { color: var(--text-primary); border-color: var(--accent); background: rgba(74, 124, 255, 0.2); }
        .content { padding: 2rem; max-width: 1280px; }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 2.5rem;
        }
        .detail-grid .detail-row.wide { grid-column: 1 / -1; }
        @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }
        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .detail-card .detail-header { margin-bottom: 0.4rem; }
        .detail-title { font-size: 1.1rem; font-weight: 700; }
        .status {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-xs);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-success { color: var(--green); background: var(--green-bg); }
        .status-failed { color: var(--red); background: var(--red-bg); }
        .status-start { color: var(--amber); background: var(--amber-bg); }
        .stale-badge { color: var(--red); font-size: 0.75rem; font-weight: 600; margin-left: 0.4rem; }
        .detail-row {
            display: flex;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            width: 140px;
            flex-shrink: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .detail-value {
            font-size: 0.9rem;
            word-break: break-word;
        }
        .detail-value.mono {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .query-text {
            background: var(--bg-elevated);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .report-link {
            color: var(--accent);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
        .report-link:hover { text-decoration: underline; }
        .error-text { color: var(--red); }
        .loading { text-align: center; color: var(--text-muted); padding: 3rem; font-size: 1rem; }

        /* Files and trace sections */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .section-title { font-size: 1.05rem; font-weight: 700; }
        .section-meta { color: var(--text-muted); font-size: 0.85rem; }
        .section-empty { color: var(--text-muted); font-size: 0.9rem; }
        .subsection-title {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin: 1.2rem 0 0.6rem;
        }
        .btn-primary {
            padding: 0.45rem 1rem;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-xs);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.8rem;
        }
        .image-tile {
            display: block;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            text-decoration: none;
            color: var(--text-muted);
            transition: border-color 0.2s;
        }
        .image-tile:hover { border-color: var(--accent); }
        .image-tile img { display: block; width: 100%; height: 150px; object-fit: contain; background: #fff; }
        .image-tile span {
            display: block;
            padding: 0.4rem 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.7rem;
        }
        .result-card {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 0.9rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text-primary);
            transition: border-color 0.2s;
        }
        .result-card:hover { border-color: var(--accent); }
        .result-card.primary { border-color: rgba(74, 124, 255, 0.5); background: var(--accent-glow); }
        .result-icon {
            flex-shrink: 0;
            width: 2.6rem;
            padding: 0.45rem 0;
            border-radius: var(--radius-xs);
            background: #2b579a;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.03em;
        }
        .result-meta { display: flex; flex-direction: column; min-width: 0; }
        .result-meta .file-size { font-size: 0.72rem; }
        .result-name {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        details.all-files { margin-top: 0.4rem; }
        details.all-files > summary { cursor: pointer; }
        details.all-files > summary::marker { color: var(--text-muted); }
        .file-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
        .file-row:last-child { border-bottom: none; }
        .file-size { color: var(--text-muted); white-space: nowrap; }
        .overview {
            display: flex;
            gap: 2px;
            height: 12px;
            margin-bottom: 0.7rem;
        }
        .ov-seg {
            min-width: 4px;
            border: none;
            border-radius: 3px;
            opacity: 0.55;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.15s;
        }
        .ov-seg:hover { opacity: 0.85; }
        .ov-seg.selected { opacity: 1; transform: scaleY(1.35); }
        .legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; margin-bottom: 1.2rem; }
        .legend-item { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--text-secondary); }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
        .legend-time { color: var(--text-muted); font-family: var(--font-mono); font-size: 0.7rem; }
        .trace-layout {
            display: grid;
            grid-template-columns: 270px minmax(0, 1fr);
            gap: 1.2rem;
            align-items: start;
        }
        @media (max-width: 900px) { .trace-layout { grid-template-columns: 1fr; } }
        .timeline {
            position: sticky;
            top: 1rem;
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            padding: 0.2rem 0.2rem 0.2rem 0;
        }
        .tl-item {
            position: relative;
            display: flex;
            gap: 0.7rem;
            width: 100%;
            padding: 0.5rem 0.6rem 0.5rem 0.5rem;
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-family: var(--font-display);
            text-align: left;
            cursor: pointer;
            transition: background 0.15s;
        }
        /* rail between dots */
        .tl-item::before {
            content: '';
            position: absolute;
            left: calc(0.5rem + 4px);
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }
        .tl-item:first-child::before { top: 50%; }
        .tl-item:last-child::before { bottom: 50%; }
        .tl-item:hover { background: var(--bg-elevated); }
        .tl-item.selected { background: var(--bg-elevated); border-color: var(--border-hover); }
        .tl-dot {
            position: relative;
            flex-shrink: 0;
            width: 10px;
            height: 10px;
            margin-top: 0.3rem;
            border-radius: 50%;
            background: var(--agent-color);
            box-shadow: 0 0 0 3px var(--bg-card);
        }
        .tl-item:hover .tl-dot, .tl-item.selected .tl-dot { box-shadow: 0 0 0 3px var(--bg-elevated); }
        .tl-item.selected .tl-dot { outline: 2px solid var(--agent-color); outline-offset: 2px; }
        .tl-body { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; flex: 1; }
        .tl-top { display: flex; align-items: center; gap: 0.45rem; }
        .tl-agent { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
        .tl-item.selected .tl-agent { color: var(--agent-color); }
        .tl-time { margin-left: auto; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); }
        .tl-sub { font-size: 0.7rem; color: var(--text-muted); }
        .tl-pane { min-width: 0; }
        .tl-item.running .tl-dot { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 3px var(--agent-color); }
            50% { box-shadow: 0 0 0 3px var(--bg-card), 0 0 0 7px transparent; }
        }
        .tl-pane .step-detail { margin-top: 0; border-top: none; padding-top: 0; }
        .step-detail {
            margin-top: 1.2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.2rem;
        }
        .step-detail-header { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 0.8rem; }
        .agent-name { font-weight: 700; color: var(--agent-color, var(--accent)); }
        .trace-block { margin-bottom: 0.9rem; }
        .trace-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .trace-label .tool-name { color: var(--amber); font-family: var(--font-mono); }
        .trace-text, .trace-pre {
            background: var(--bg-elevated);
            border-radius: var(--radius-sm);
            padding: 0.7rem 0.9rem;
            font-size: 0.85rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 480px;
            overflow: auto;
        }
        .trace-pre {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            line-height: 1.5;
            color: var(--text-secondary);
        }
        .trace-pre.code { background: #0a0c10; border: 1px solid var(--border); }
        .trace-text.muted { color: var(--text-muted); font-style: italic; }
        .trace-usage { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
        details.record {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 0.5rem;
        }
        details.record[open] { border-color: var(--border-hover); }
        .record-summary {
            display: flex;
            align-items: baseline;
            gap: 0.7rem;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            list-style: none;
            font-size: 0.8rem;
        }
        .record-summary::-webkit-details-marker { display: none; }
        .record-summary::before { content: '▸'; color: var(--text-muted); font-size: 0.75rem; }
        details.record[open] > .record-summary::before { content: '▾'; }
        .record-label { font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
        .record-label .tool-name { color: var(--amber); font-family: var(--font-mono); font-weight: 500; }
        .record-preview {
            color: var(--text-muted);
            font-size: 0.78rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        details.record[open] > .record-summary .record-preview { display: none; }
        .record-body { padding: 0 0.8rem 0.8rem; }
        details.record-raw { margin-top: 0.6rem; }
        details.record-raw > summary { cursor: pointer; color: var(--text-muted); font-size: 0.72rem; font-family: var(--font-mono); }
        .json-node > summary { cursor: pointer; font-family: var(--font-mono); font-size: 0.76rem; }
        .json-children { padding-left: 1.1rem; border-left: 1px dashed var(--border); margin-left: 0.3rem; }
        .json-row { font-family: var(--font-mono); font-size: 0.76rem; padding: 0.1rem 0; word-break: break-word; }
        .json-row .trace-pre { margin: 0.25rem 0 0.4rem; }
        .json-key { color: var(--accent-hover); }
        .json-meta { color: var(--text-muted); }
        .json-string { color: var(--green); white-space: pre-wrap; }
        .json-number { color: var(--amber); }
        .json-boolean, .json-null { color: #f472b6; }
        .decision {
            display: inline-block;
            padding: 0.05rem 0.45rem;
            border-radius: var(--radius-xs);
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .decision-ok { color: var(--green); background: var(--green-bg); }
        .decision-warn { color: var(--amber); background: var(--amber-bg); }
        .decision-muted { color: var(--text-muted); background: var(--bg-elevated); }
        .decision-fail { color: var(--red); background: var(--red-bg); }
        .hitl-card { background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 0.7rem 0.9rem; }
        .hitl-feedback { font-size: 0.9rem; line-height: 1.55; white-space: pre-wrap; margin-bottom: 0.4rem; }
        .hitl-summary { margin-bottom: 1rem; }
        .hitl-summary .subsection-title { margin-top: 0; }
        .hitl-row { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.25rem 0; font-size: 0.85rem; }
        .hitl-feedback-inline { color: var(--text-primary); }
        .step-actions { margin-left: auto; display: flex; gap: 0.8rem; }
        .btn-link {
            background: none;
            border: none;
            color: var(--accent);
            font-family: var(--font-display);
            font-size: 0.78rem;
            cursor: pointer;
        }
        .btn-link:hover { text-decoration: underline; }
        details.full-prompt { margin-bottom: 1rem; }
        details.full-prompt summary { cursor: pointer; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-title" data-i18n="admin_title">Deep Insight Admin</div>
            <div class="header-badge" data-i18n="admin_badge">Admin</div>
        </div>
        <div class="header-right">
            <a href="/admin/dashboard" class="btn-sm" data-i18n="admin_all_jobs">All Jobs</a>
            <div class="lang-area">
                <span class="lang-label">Language</span>
                <button class="lang-toggle" id="admin-lang-toggle" onclick="toggleAdminLang()">EN</button>
            </div>
            <a href="/" class="btn-sm" data-i18n="admin_webui">Web UI</a>
            <button class="btn-sm" onclick="handleLogout()" data-i18n="admin_logout">Logout</button>
        </div>
    </div>

    <div class="content">
        <a href="/admin/dashboard" class="back-link" data-i18n="back_all_jobs">Back to all jobs</a>
        <div id="jobDetail" class="loading" data-i18n="detail_loading">Loading job details...</div>
        <div id="traceSection"></div>
        <div id="filesSection"></div>
    </div>

    <script src="/admin/static/admin-i18n.js"></script>
    <script>
        var currentJob = null;

        function formatTime(epoch) {
            if (!epoch) return '-';
            var d = new Date(epoch * 1000);
            var y = d.getFullYear();
            var mo = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            var h = String(d.getHours()).padStart(2, '0');
            var m = String(d.getMinutes()).padStart(2, '0');
            var s = String(d.getSeconds()).padStart(2, '0');
            return y + '-' + mo + '-' + day + ' ' + h + ':' + m + ':' + s;
        }

        function formatDuration(seconds) {
            if (!seconds) return '-';
            if (seconds < 60) return seconds + 's';
            var min = Math.floor(seconds / 60);
            var sec = seconds % 60;
            return min + 'm ' + sec + 's';
        }

        function formatTokens(n) {
            if (!n) return '-';
            return n.toLocaleString();
        }

        function isStale(job) {
            if (job.status !== 'Start') return false;
            var now = Math.floor(Date.now() / 1000);
            return (now - job.started_at) > 1800;
        }

        function addRow(container, label, valueNode, wide) {
            var row = document.createElement('div');
            row.className = 'detail-row' + (wide ? ' wide' : '');

            var labelDiv = document.createElement('div');
            labelDiv.className = 'detail-label';
            labelDiv.textContent = label;

            var valueDiv = document.createElement('div');
            valueDiv.className = 'detail-value';
            if (typeof valueNode === 'string') {
                valueDiv.textContent = valueNode;
            } else {
                valueDiv.appendChild(valueNode);
            }

            row.appendChild(labelDiv);
            row.appendChild(valueDiv);
            container.appendChild(row);
        }

        function addMonoRow(container, label, text) {
            var row = document.createElement('div');
            row.className = 'detail-row';

            var labelDiv = document.createElement('div');
            labelDiv.className = 'detail-label';
            labelDiv.textContent = label;

            var valueDiv = document.createElement('div');
            valueDiv.className = 'detail-value mono';
            valueDiv.textContent = text;

            row.appendChild(labelDiv);
            row.appendChild(valueDiv);
            container.appendChild(row);
        }

        function renderJob(job) {
            var wrapper = document.getElementById('jobDetail');
            wrapper.className = 'detail-card';
            wrapper.replaceChildren();

            // Header: title + status
            var header = document.createElement('div');
            header.className = 'detail-header';

            var title = document.createElement('div');
            title.className = 'detail-title';
            title.textContent = t('detail_title');
            header.appendChild(title);

            var statusSpan = document.createElement('span');
            statusSpan.className = 'status status-' + job.status.toLowerCase();
            statusSpan.textContent = t('status_' + job.status.toLowerCase());
            header.appendChild(statusSpan);

            if (isStale(job)) {
                var staleSpan = document.createElement('span');
                staleSpan.className = 'stale-badge';
                staleSpan.textContent = t('jobs_stale');
                header.appendChild(staleSpan);
            }

            wrapper.appendChild(header);

            // Rows: two columns, long values span both
            var grid = document.createElement('div');
            grid.className = 'detail-grid';
            wrapper.appendChild(grid);

            addMonoRow(grid, t('label_job_id'), job.job_id || '-');
            addMonoRow(grid, t('label_session_id'), job.session_id || '-');

            if (job.user_query) {
                var queryDiv = document.createElement('div');
                queryDiv.className = 'query-text';
                queryDiv.textContent = job.user_query;
                addRow(grid, t('label_query'), queryDiv, true);
            } else {
                addRow(grid, t('label_query'), '-', true);
            }

            addMonoRow(grid, t('label_started'), formatTime(job.started_at));
            addMonoRow(grid, t('label_completed'), formatTime(job.ended_at));
            addMonoRow(grid, t('label_duration'), formatDuration(job.elapsed_seconds));
            addMonoRow(grid, t('label_total_tokens'), formatTokens(job.total_tokens));
            addMonoRow(grid, t('label_input_tokens'), formatTokens(job.input_tokens));
            addMonoRow(grid, t('label_output_tokens'), formatTokens(job.output_tokens));
            addMonoRow(grid, t('label_cache_read'), formatTokens(job.cache_read_input_tokens));
            addMonoRow(grid, t('label_cache_write'), formatTokens(job.cache_creation_input_tokens));
            addMonoRow(grid, t('label_cache_hit'), job.cache_hit_rate != null ? job.cache_hit_rate + '%' : '-');

            // Report file (with download link if session_id exists)
            if (job.report_filename && job.session_id) {
                var link = document.createElement('a');
                link.className = 'report-link';
                link.textContent = job.report_filename;
                link.href = fileUrl('artifacts', job.report_filename, true);
                addRow(grid, t('label_report'), link);
            } else {
                addMonoRow(grid, t('label_report'), job.report_filename || '-');
            }

            // Error (if failed)
            if (job.error_message) {
                var errorSpan = document.createElement('span');
                errorSpan.className = 'error-text';
                errorSpan.textContent = job.error_message;
                addRow(grid, t('label_error'), errorSpan, true);
            }
        }

        // ---------- Files ----------

        var IMAGE_EXT = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg'];
        var RESULT_EXT = ['.docx', '.pdf', '.pptx', '.xlsx'];
        var currentFiles = null;
        var currentTrace = null;
        var selectedStep = 0;
        // While a job runs, keep the newest step selected until the user picks another
        var followLatest = true;
        // Open/closed state per record (by seq), kept across refreshes
        var recordOpen = {};
        var timelineScroll = 0;

        function jobId() {
            var parts = window.location.pathname.split('/');
            return parts[parts.length - 1];
        }

        function fileUrl(area, name, download) {
            var path = name.split('/').map(encodeURIComponent).join('/');
            return '/admin/api/jobs/' + encodeURIComponent(jobId()) + '/files/' + area + '/' + path +
                (download ? '?download=true' : '');
        }

        function isImage(name) {
            var lower = name.toLowerCase();
            return IMAGE_EXT.some(function(ext) { return lower.endsWith(ext); });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function sectionShell(container, titleKey, metaText) {
            container.className = 'section';
            container.replaceChildren();
            var header = el('div', 'section-header');
            var left = el('div');
            left.appendChild(el('div', 'section-title', t(titleKey)));
            if (metaText) left.appendChild(el('div', 'section-meta', metaText));
            header.appendChild(left);
            container.appendChild(header);
            return header;
        }

        function renderFileList(container, area, files) {
            if (!files.length) {
                container.appendChild(el('div', 'section-empty', t('files_none')));
                return;
            }
            files.forEach(function(f) {
                var row = el('div', 'file-row');
                var link = el('a', 'report-link', f.name);
                link.href = fileUrl(area, f.name, true);
                row.appendChild(link);
                row.appendChild(el('span', 'file-size', formatSize(f.size)));
                container.appendChild(row);
            });
        }

        function renderFiles() {
            var container = document.getElementById('filesSection');
            if (!currentFiles) return;
            if (currentFiles.error) {
                sectionShell(container, 'files_title');
                container.appendChild(el('div', 'section-empty', t('files_load_error')));
                return;
            }
            var header = sectionShell(container, 'files_title');
            // Same pick as the Lambda (first .docx); jobs recorded before their
            // artifacts reached S3 have no report_filename
            var docx = currentFiles.artifacts.find(function(f) { return f.name.toLowerCase().endsWith('.docx'); });
            var report = (currentJob && currentJob.report_filename) || (docx && docx.name);
            if (report) {
                var btn = el('a', 'btn-primary', t('files_download_report'));
                btn.href = fileUrl('artifacts', report, true);
                header.appendChild(btn);
            }

            var artifacts = currentFiles.artifacts;

            // 1. Input data
            container.appendChild(el('div', 'subsection-title', t('files_input') + ' (' + currentFiles.input.length + ')'));
            renderFileList(container, 'input', currentFiles.input);

            // 2. Result files: documents, the job's report first
            var results = artifacts.filter(function(f) { return RESULT_EXT.some(function(ext) { return f.name.toLowerCase().endsWith(ext); }); });
            results.sort(function(a, b) { return (b.name === report) - (a.name === report); });
            container.appendChild(el('div', 'subsection-title', t('files_results') + ' (' + results.length + ')'));
            if (results.length) {
                var cards = el('div', 'result-grid');
                results.forEach(function(f) {
                    var card = el('a', 'result-card' + (f.name === report ? ' primary' : ''));
                    card.href = fileUrl('artifacts', f.name, true);
                    card.title = f.name;
                    card.appendChild(el('span', 'result-icon', f.name.split('.').pop().toUpperCase()));
                    var meta = el('span', 'result-meta');
                    meta.appendChild(el('span', 'result-name', f.name));
                    meta.appendChild(el('span', 'file-size', formatSize(f.size) + (f.name === report ? ' · ' + t('files_report_badge') : '')));
                    card.appendChild(meta);
                    cards.appendChild(card);
                });
                container.appendChild(cards);
            } else {
                container.appendChild(el('div', 'section-empty', t('files_none')));
            }

            // 3. Images: charts are saved as .png and .svg; show one per chart
            var names = {};
            artifacts.forEach(function(f) { names[f.name] = true; });
            var images = artifacts.filter(function(f) {
                if (!isImage(f.name)) return false;
                return !(f.name.toLowerCase().endsWith('.svg') && names[f.name.replace(/\.svg$/i, '.png')]);
            });
            container.appendChild(el('div', 'subsection-title', t('files_images') + ' (' + images.length + ')'));
            if (images.length) {
                var grid = el('div', 'image-grid');
                images.forEach(function(f) {
                    var tile = el('a', 'image-tile');
                    tile.href = fileUrl('artifacts', f.name, false);
                    tile.target = '_blank';
                    tile.rel = 'noopener';
                    var img = el('img');
                    img.src = tile.href;
                    img.loading = 'lazy';
                    img.alt = f.name;
                    tile.appendChild(img);
                    tile.appendChild(el('span', null, f.name));
                    grid.appendChild(tile);
                });
                container.appendChild(grid);
            } else {
                container.appendChild(el('div', 'section-empty', t('files_none')));
            }

            // 4. Every generated file (code, cache, intermediate results), collapsed
            var all = el('details', 'all-files');
            all.appendChild(el('summary', 'subsection-title', t('files_all') + ' (' + artifacts.length + ')'));
            renderFileList(all, 'artifacts', artifacts);
            container.appendChild(all);
        }

        async function fetchFiles(quiet) {
            var container = document.getElementById('filesSection');
            if (!quiet) {
                sectionShell(container, 'files_title');
                container.appendChild(el('div', 'section-empty', t('files_loading')));
            }
            try {
                var res = await fetch('/admin/api/jobs/' + encodeURIComponent(jobId()) + '/files');
                var data = await res.json();
                currentFiles = data.success ? data : { error: true };
            } catch (e) {
                currentFiles = { error: true };
            }
            renderFiles();
        }

        // ---------- Agent trace ----------

        var AGENT_COLORS = {
            coordinator: '#a78bfa', planner: '#4a7cff', plan_reviewer: '#fbbf24', supervisor: '#f472b6',
            coder: '#34d399', validator: '#22d3ee', reporter: '#fb923c', tracker: '#94a3b8', auditor: '#f87171'
        };
        // Keys whose string values are code or file content
        var CODE_KEYS = ['code', 'content', 'cmd', 'command', 'script'];

        function agentLabel(agent) {
            return agent.split('_').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
        }

        function seconds(fromIso, toIso) {
            var d = (Date.parse(toIso) - Date.parse(fromIso)) / 1000;
            return isNaN(d) ? 0 : d;
        }

        function formatCompact(n) {
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return Math.round(n / 1e3) + 'k';
            return String(n);
        }

        function formatSeconds(s) {
            if (s < 1) return '<1s';
            if (s < 60) return s.toFixed(0) + 's';
            return Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's';
        }

        // Consecutive records of one agent form a step. A Supervisor that calls
        // the Coder shows as Supervisor -> Coder -> Supervisor, in run order.
        function buildSteps(records) {
            var steps = [];
            records.forEach(function(r) {
                if (r.kind === 'input') return;
                var agent = r.agent || 'system';
                var last = steps[steps.length - 1];
                if (!last || last.agent !== agent) {
                    last = { agent: agent, records: [], start: r.ts, end: r.ts, tools: 0, tokens: 0 };
                    steps.push(last);
                }
                last.records.push(r);
                last.end = r.end_ts || r.ts;
                if (r.kind === 'tool_use') last.tools++;
                if (r.kind === 'plan_feedback') last.decision = r.decision;
                if (r.kind === 'usage') last.tokens += (r.input_tokens || 0) + (r.output_tokens || 0) +
                    (r.cache_read_input_tokens || 0) + (r.cache_write_input_tokens || 0);
            });
            return steps;
        }

        // ---------- Record rendering ----------
        // Each record is a collapsible block: summary line with a preview,
        // body with the full content, and the raw record as a JSON tree.

        var OPEN_BY_DEFAULT = { text: true, plan_review: true, plan_feedback: true };

        function preview(value) {
            var text = typeof value === 'string' ? value : JSON.stringify(value);
            text = (text || '').replace(/\s+/g, ' ').trim();
            return text.length > 120 ? text.slice(0, 120) + '…' : text;
        }

        function parseJson(text) {
            if (typeof text !== 'string') return null;
            var trimmed = text.trim();
            if (trimmed.charAt(0) !== '{' && trimmed.charAt(0) !== '[') return null;
            try { return JSON.parse(trimmed); } catch (e) { return null; }
        }

        // Collapsible JSON tree. Multi-line strings and code keys render as blocks.
        function jsonTree(value, key, depth) {
            depth = depth || 0;
            var isObject = value && typeof value === 'object';
            if (!isObject) {
                var row = el('div', 'json-row');
                if (key != null) row.appendChild(el('span', 'json-key', key + ': '));
                if (typeof value === 'string' && (value.indexOf('\n') >= 0 || CODE_KEYS.indexOf(key) >= 0)) {
                    row.appendChild(el('div', 'trace-pre code', value));
                } else {
                    var cls = 'json-' + (value === null ? 'null' : typeof value);
                    row.appendChild(el('span', cls, typeof value === 'string' ? '"' + value + '"' : String(value)));
                }
                return row;
            }
            var isArray = Array.isArray(value);
            var keys = Object.keys(value);
            var node = el('details', 'json-node');
            node.open = depth < 2;
            var summary = el('summary');
            if (key != null) summary.appendChild(el('span', 'json-key', key + ': '));
            summary.appendChild(el('span', 'json-meta', isArray ? '[' + keys.length + ']' : '{' + keys.length + '}'));
            node.appendChild(summary);
            var children = el('div', 'json-children');
            keys.forEach(function(k) { children.appendChild(jsonTree(value[k], isArray ? Number(k) : k, depth + 1)); });
            node.appendChild(children);
            return node;
        }

        function recordBlock(r, labelNode, previewText, open) {
            var block = el('details', 'record');
            block.open = r.seq in recordOpen ? recordOpen[r.seq] : open;
            block.addEventListener('toggle', function() { recordOpen[r.seq] = block.open; });
            var summary = el('summary', 'record-summary');
            summary.appendChild(labelNode);
            if (previewText) summary.appendChild(el('span', 'record-preview', previewText));
            block.appendChild(summary);
            var body = el('div', 'record-body');
            block.appendChild(body);
            block.raw = r;
            return { block: block, body: body };
        }

        function appendRaw(body, r) {
            var raw = el('details', 'record-raw');
            raw.appendChild(el('summary', null, t('trace_raw_json')));
            raw.appendChild(jsonTree(r, null, 1));
            body.appendChild(raw);
        }

        function label(text, toolName) {
            var node = el('span', 'record-label', text);
            if (toolName) node.appendChild(el('span', 'tool-name', ' ' + toolName));
            return node;
        }

        function renderToolOutput(body, output, codeShown) {
            // Code interpreter tools return "status||code||stdout"; the code is
            // skipped when the tool call above already shows it.
            var parts = typeof output === 'string' ? output.split('||') : [];
            if (parts.length === 3) {
                body.appendChild(el('div', 'trace-label', t('trace_status') + ': ' + parts[0]));
                if (parts[1].trim() && !codeShown) {
                    body.appendChild(el('div', 'trace-label', t('trace_code')));
                    body.appendChild(el('div', 'trace-pre code', parts[1]));
                }
                body.appendChild(el('div', 'trace-label', t('trace_output')));
                body.appendChild(el('div', 'trace-pre', parts[2]));
                return;
            }
            var parsed = parseJson(output);
            if (parsed) body.appendChild(jsonTree(parsed));
            else body.appendChild(el('div', 'trace-pre', output == null ? '' : String(output)));
        }

        function decisionBadge(decision) {
            var tone = decision === 'approved' ? 'ok' : decision === 'revision_requested' ? 'warn' : 'muted';
            return el('span', 'decision decision-' + tone, t('hitl_' + decision));
        }

        function renderPlanFeedback(r) {
            var labelNode = label(t('trace_plan_feedback') + ' (#' + ((r.revision_count || 0) + 1) + ')');
            labelNode.appendChild(document.createTextNode(' '));
            labelNode.appendChild(decisionBadge(r.decision));
            var parts = recordBlock(r, labelNode, r.feedback ? '“' + preview(r.feedback) + '”' : '', true);
            var card = el('div', 'hitl-card');
            card.appendChild(el('div', 'trace-label', t('hitl_feedback')));
            card.appendChild(el('div', r.feedback ? 'hitl-feedback' : 'section-empty', r.feedback || t('hitl_no_feedback')));
            card.appendChild(el('div', 'trace-usage', t('hitl_waited') + ': ' + formatSeconds(r.waited_seconds || 0)));
            parts.body.appendChild(card);
            appendRaw(parts.body, r);
            return parts.block;
        }

        function renderRecord(r, shownToolIds) {
            if (r.kind === 'usage') {
                return el('div', 'trace-block trace-usage',
                    t('trace_tokens') + ': in ' + formatTokens(r.input_tokens) + ' · out ' + formatTokens(r.output_tokens) +
                    ' · cache read ' + formatTokens(r.cache_read_input_tokens) +
                    ' · cache write ' + formatTokens(r.cache_write_input_tokens) + ' — ' + (r.model_id || ''));
            }
            if (r.kind === 'plan_feedback') return renderPlanFeedback(r);

            var open = !!OPEN_BY_DEFAULT[r.kind];
            var parts;
            if (r.kind === 'text') {
                parts = recordBlock(r, label(t('trace_text')), preview(r.text), open);
                parts.body.appendChild(el('div', 'trace-text', r.text));
            } else if (r.kind === 'reasoning') {
                parts = recordBlock(r, label(t('trace_reasoning')), preview(r.text), open);
                parts.body.appendChild(el('div', 'trace-text muted', r.text));
            } else if (r.kind === 'plan_review') {
                parts = recordBlock(r, label(t('trace_plan') + ' (#' + ((r.revision_count || 0) + 1) + ')'), preview(r.plan), open);
                parts.body.appendChild(el('div', 'trace-text', r.plan));
            } else if (r.kind === 'tool_use') {
                var inputPreview = r.input && typeof r.input === 'object' ? preview(r.input.code || r.input.task || r.input) : preview(r.input);
                parts = recordBlock(r, label(t('trace_tool_call'), r.tool), inputPreview, open);
                if (r.input && typeof r.input === 'object') parts.body.appendChild(jsonTree(r.input));
                else parts.body.appendChild(el('div', 'trace-pre code', r.input == null ? '' : String(r.input)));
                if (r.tool_id) shownToolIds[r.tool_id] = true;
            } else if (r.kind === 'tool_result') {
                // Code interpreter results ("status||code||stdout"): status badge + stdout preview
                var out = typeof r.output === 'string' ? r.output.split('||') : [];
                var resultLabel = label(t('trace_tool_result'), r.tool);
                if (out.length === 3) {
                    resultLabel.appendChild(document.createTextNode(' '));
                    resultLabel.appendChild(el('span', 'decision ' + (out[0] === 'completed' ? 'decision-ok' : 'decision-fail'), out[0]));
                }
                parts = recordBlock(r, resultLabel, preview(out.length === 3 ? out[2] : r.output), open);
                renderToolOutput(parts.body, r.output, !!shownToolIds[r.tool_id]);
            } else {
                parts = recordBlock(r, label(r.kind), '', open);
            }
            appendRaw(parts.body, r);
            return parts.block;
        }

        function setAllOpen(container, open) {
            container.querySelectorAll('details.record').forEach(function(d) { d.open = open; });
        }

        function renderStepDetail(container, step, index) {
            var detail = el('div', 'step-detail');
            detail.style.setProperty('--agent-color', AGENT_COLORS[step.agent] || 'var(--accent)');
            var header = el('div', 'step-detail-header');
            header.appendChild(el('span', 'agent-name', '#' + (index + 1) + ' ' + agentLabel(step.agent)));
            header.appendChild(el('span', 'section-meta',
                formatSeconds(seconds(step.start, step.end)) + ' · ' + step.tools + ' ' + t('trace_tools')));
            var actions = el('span', 'step-actions');
            var expand = el('button', 'btn-link', t('trace_expand_all'));
            expand.onclick = function() { setAllOpen(detail, true); };
            var collapse = el('button', 'btn-link', t('trace_collapse_all'));
            collapse.onclick = function() { setAllOpen(detail, false); };
            actions.appendChild(expand);
            actions.appendChild(collapse);
            header.appendChild(actions);
            detail.appendChild(header);
            var shownToolIds = {};
            step.records.forEach(function(r) { detail.appendChild(renderRecord(r, shownToolIds)); });
            container.appendChild(detail);
        }

        // One line per plan review: what the user saw and what they answered
        function renderHitlSummary(container, records) {
            var results = records.filter(function(r) { return r.kind === 'plan_feedback'; });
            if (!results.length) return;
            var box = el('div', 'hitl-summary');
            box.appendChild(el('div', 'subsection-title', t('hitl_title')));
            results.forEach(function(r) {
                var row = el('div', 'hitl-row');
                row.appendChild(el('span', 'step-num', '#' + ((r.revision_count || 0) + 1)));
                row.appendChild(decisionBadge(r.decision));
                row.appendChild(el('span', r.feedback ? 'hitl-feedback-inline' : 'section-meta',
                    r.feedback ? '“' + r.feedback + '”' : t('hitl_no_feedback')));
                row.appendChild(el('span', 'section-meta', formatSeconds(r.waited_seconds || 0)));
                box.appendChild(row);
            });
            container.appendChild(box);
        }

        function renderTrace() {
            var container = document.getElementById('traceSection');
            if (!currentTrace) return;
            if (currentTrace.error) {
                sectionShell(container, 'trace_title');
                container.appendChild(el('div', 'section-empty', t('trace_load_error')));
                return;
            }
            if (!currentTrace.available) {
                sectionShell(container, 'trace_title');
                container.appendChild(el('div', 'section-empty', t('trace_unavailable')));
                return;
            }

            var steps = buildSteps(currentTrace.records);
            var tools = steps.reduce(function(n, s) { return n + s.tools; }, 0);
            sectionShell(container, 'trace_title',
                steps.length + ' ' + t('trace_steps') + ' · ' + tools + ' ' + t('trace_tools') + ' · ' +
                (isRunning() ? t('trace_auto_refresh') : t('trace_hint')));

            var input = currentTrace.records.find(function(r) { return r.kind === 'input'; });
            if (input && input.prompt) {
                var details = el('details', 'full-prompt');
                details.appendChild(el('summary', null, t('trace_full_prompt')));
                details.appendChild(el('div', 'query-text', input.prompt));
                container.appendChild(details);
            }
            renderHitlSummary(container, currentTrace.records);

            var color = function(agent) { return AGENT_COLORS[agent] || 'var(--accent)'; };
            var running = isRunning();
            if (running && followLatest) selectedStep = steps.length - 1;
            var select = function(i) {
                var tl = container.querySelector('.timeline');
                timelineScroll = tl ? tl.scrollTop : 0;
                selectedStep = i;
                followLatest = i === steps.length - 1;
                renderTrace();
            };

            // Overview: one segment per step, width by duration
            var overview = el('div', 'overview');
            steps.forEach(function(step, i) {
                var seg = el('button', 'ov-seg' + (i === selectedStep ? ' selected' : ''));
                seg.style.flexGrow = Math.max(seconds(step.start, step.end), 1);
                seg.style.background = color(step.agent);
                seg.title = '#' + (i + 1) + ' ' + agentLabel(step.agent) + ' · ' + formatSeconds(seconds(step.start, step.end));
                seg.onclick = function() { select(i); };
                overview.appendChild(seg);
            });
            container.appendChild(overview);

            // Legend: agents in order of first appearance, with total time
            var totals = {}, order = [];
            steps.forEach(function(step) {
                if (!(step.agent in totals)) { totals[step.agent] = 0; order.push(step.agent); }
                totals[step.agent] += seconds(step.start, step.end);
            });
            var legend = el('div', 'legend');
            order.forEach(function(agent) {
                var item = el('span', 'legend-item');
                var dot = el('span', 'legend-dot');
                dot.style.background = color(agent);
                item.appendChild(dot);
                item.appendChild(el('span', null, agentLabel(agent)));
                item.appendChild(el('span', 'legend-time', formatSeconds(totals[agent])));
                legend.appendChild(item);
            });
            container.appendChild(legend);

            // Timeline (left) + selected step (right)
            var layout = el('div', 'trace-layout');
            var timeline = el('div', 'timeline');
            steps.forEach(function(step, i) {
                var isCurrent = running && i === steps.length - 1;
                var item = el('button', 'tl-item' + (i === selectedStep ? ' selected' : '') + (isCurrent ? ' running' : ''));
                item.style.setProperty('--agent-color', color(step.agent));
                item.appendChild(el('span', 'tl-dot'));
                var body = el('span', 'tl-body');
                var top = el('span', 'tl-top');
                top.appendChild(el('span', 'tl-agent', agentLabel(step.agent)));
                if (step.decision) top.appendChild(decisionBadge(step.decision));
                if (isCurrent) top.appendChild(el('span', 'decision decision-warn', t('trace_running')));
                top.appendChild(el('span', 'tl-time', formatSeconds(seconds(step.start, step.end))));
                body.appendChild(top);
                var sub = ['#' + (i + 1)];
                if (step.tools) sub.push(step.tools + ' ' + t('trace_tools'));
                if (step.tokens) sub.push(formatCompact(step.tokens) + ' ' + t('trace_tokens_short'));
                body.appendChild(el('span', 'tl-sub', sub.join(' · ')));
                item.appendChild(body);
                item.onclick = function() { select(i); };
                timeline.appendChild(item);
            });
            layout.appendChild(timeline);
            var pane = el('div', 'tl-pane');
            if (steps[selectedStep]) renderStepDetail(pane, steps[selectedStep], selectedStep);
            layout.appendChild(pane);
            container.appendChild(layout);
            timeline.scrollTop = timelineScroll;
        }

        async function fetchTrace(quiet) {
            var container = document.getElementById('traceSection');
            if (!quiet) {
                sectionShell(container, 'trace_title');
                container.appendChild(el('div', 'section-empty', t('trace_loading')));
            }
            try {
                var res = await fetch('/admin/api/jobs/' + encodeURIComponent(jobId()) + '/trace');
                var data = await res.json();
                currentTrace = data.success ? data : { error: true };
            } catch (e) {
                currentTrace = { error: true };
            }
            renderTrace();
        }

        // A running job refreshes itself: the runtime re-uploads the trace as it goes
        var REFRESH_MS = 15000;

        function isRunning() {
            return !!currentJob && currentJob.status === 'Start';
        }

        async function loadJob(quiet) {
            try {
                var res = await fetch('/admin/api/jobs/' + encodeURIComponent(jobId()));
                if (res.status === 401) {
                    window.location.href = '/admin/login';
                    return false;
                }
                var data = await res.json();
                if (data.success) {
                    currentJob = data.job;
                    renderJob(currentJob);
                    document.title = 'Deep Insight — Job ' + (currentJob.status || '');
                    return true;
                }
                if (!quiet) {
                    var wrapper = document.getElementById('jobDetail');
                    wrapper.className = 'loading';
                    wrapper.textContent = data.error || t('detail_not_found');
                }
            } catch (e) {
                if (!quiet) {
                    var wrapper = document.getElementById('jobDetail');
                    wrapper.className = 'loading';
                    wrapper.textContent = t('detail_load_error');
                }
            }
            return false;
        }

        function scheduleRefresh() {
            if (isRunning()) setTimeout(refreshRunning, REFRESH_MS);
        }

        async function refreshRunning() {
            if (await loadJob(true)) await Promise.all([fetchFiles(true), fetchTrace(true)]);
            scheduleRefresh();
        }

        async function fetchJob() {
            if (!(await loadJob(false))) return;
            await Promise.all([fetchFiles(), fetchTrace()]);
            scheduleRefresh();
        }

        async function handleLogout() {
            await fetch('/admin/logout', { method: 'POST' });
            window.location.href = '/admin/login';
        }

        // Re-render detail when language changes
        function onLangChange() {
            if (currentJob) renderJob(currentJob);
            renderFiles();
            renderTrace();
        }

        applyAdminLang();
        fetchJob();
    </script>
</body>
</html>
