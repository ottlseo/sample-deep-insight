<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Insight — Job Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin/static/trace-view.css">
    <style>
        :root {
            --bg-deep: #0d0f13;
            --bg-surface: #161921;
            --bg-card: #1c2029;
            --bg-elevated: #232833;
            --border: #2a2f3a;
            --border-hover: #3d445a;
            --text-primary: #e8eaf0;
            --text-secondary: #dce0eb;
            --text-muted: #a8b2c8;
            --accent: #4a7cff;
            --accent-glow: rgba(74, 124, 255, 0.15);
            --accent-hover: #6190ff;
            --green: #34d399;
            --green-bg: rgba(52, 211, 153, 0.1);
            --red: #f87171;
            --red-bg: rgba(248, 113, 113, 0.1);
            --amber: #fbbf24;
            --amber-bg: rgba(251, 191, 36, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-display);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .header-title { font-size: 1.2rem; font-weight: 700; }
        .header-badge {
            font-size: 0.75rem;
            color: var(--accent);
            background: var(--accent-glow);
            border: 1px solid rgba(74, 124, 255, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-xs);
        }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .btn-sm {
            padding: 0.4rem 1rem;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-family: var(--font-display);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
        .lang-area { display: flex; align-items: center; gap: 0.5rem; }
        .lang-label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; }
        .lang-toggle {
            padding: 0.35rem 0.9rem;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(74, 124, 255, 0.3);
            border-radius: var(--radius-xs);
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-toggle:hover { color: var(--text-primary); border-color: var(--accent); background: rgba(74, 124, 255, 0.2); }
        .content { padding: 2rem; max-width: 1280px; }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 2.5rem;
        }
        .detail-grid .detail-row.wide { grid-column: 1 / -1; }
        @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }
        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .detail-card .detail-header { margin-bottom: 0.4rem; }
        .detail-title { font-size: 1.1rem; font-weight: 700; }
        .status {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-xs);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-success { color: var(--green); background: var(--green-bg); }
        .status-failed { color: var(--red); background: var(--red-bg); }
        .status-start { color: var(--amber); background: var(--amber-bg); }
        .stale-badge { color: var(--red); font-size: 0.75rem; font-weight: 600; margin-left: 0.4rem; }
        .detail-row {
            display: flex;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border);
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            width: 140px;
            flex-shrink: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .detail-value {
            font-size: 0.9rem;
            word-break: break-word;
        }
        .detail-value.mono {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .query-text {
            background: var(--bg-elevated);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .report-link {
            color: var(--accent);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
        .report-link:hover { text-decoration: underline; }
        .error-text { color: var(--red); }
        .loading { text-align: center; color: var(--text-muted); padding: 3rem; font-size: 1rem; }

        /* Files and trace sections */
        .section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .section-title { font-size: 1.05rem; font-weight: 700; }
        .section-meta { color: var(--text-muted); font-size: 0.85rem; }
        .section-empty { color: var(--text-muted); font-size: 0.9rem; }
        .subsection-title {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin: 1.2rem 0 0.6rem;
        }
        .btn-primary {
            padding: 0.45rem 1rem;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-xs);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.8rem;
        }
        .image-tile {
            display: block;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            text-decoration: none;
            color: var(--text-muted);
            transition: border-color 0.2s;
        }
        .image-tile:hover { border-color: var(--accent); }
        .image-tile img { display: block; width: 100%; height: 150px; object-fit: contain; background: #fff; }
        .image-tile span {
            display: block;
            padding: 0.4rem 0.6rem;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.7rem;
        }
        .result-card {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 0.9rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text-primary);
            transition: border-color 0.2s;
        }
        .result-card:hover { border-color: var(--accent); }
        .result-card.primary { border-color: rgba(74, 124, 255, 0.5); background: var(--accent-glow); }
        .result-icon {
            flex-shrink: 0;
            width: 2.6rem;
            padding: 0.45rem 0;
            border-radius: var(--radius-xs);
            background: #2b579a;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.03em;
        }
        .result-meta { display: flex; flex-direction: column; min-width: 0; }
        .result-meta .file-size { font-size: 0.72rem; }
        .result-name {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        details.all-files { margin-top: 0.4rem; }
        details.all-files > summary { cursor: pointer; }
        details.all-files > summary::marker { color: var(--text-muted); }
        .file-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
        .file-row:last-child { border-bottom: none; }
        .file-size { color: var(--text-muted); white-space: nowrap; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="header-title" data-i18n="admin_title">Deep Insight Admin</div>
            <div class="header-badge" data-i18n="admin_badge">Admin</div>
        </div>
        <div class="header-right">
            <a href="/admin/dashboard" class="btn-sm" data-i18n="admin_all_jobs">All Jobs</a>
            <div class="lang-area">
                <span class="lang-label">Language</span>
                <button class="lang-toggle" id="admin-lang-toggle" onclick="toggleAdminLang()">EN</button>
            </div>
            <a href="/" class="btn-sm" data-i18n="admin_webui">Web UI</a>
            <button class="btn-sm" onclick="handleLogout()" data-i18n="admin_logout">Logout</button>
        </div>
    </div>

    <div class="content">
        <a href="/admin/dashboard" class="back-link" data-i18n="back_all_jobs">Back to all jobs</a>
        <div id="jobDetail" class="loading" data-i18n="detail_loading">Loading job details...</div>
        <div id="traceSection"></div>
        <div id="filesSection"></div>
    </div>

    <script src="/admin/static/admin-i18n.js"></script>
    <script src="/admin/static/trace-view.js"></script>
    <script>
        var currentJob = null;

        function formatTime(epoch) {
            if (!epoch) return '-';
            var d = new Date(epoch * 1000);
            var y = d.getFullYear();
            var mo = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            var h = String(d.getHours()).padStart(2, '0');
            var m = String(d.getMinutes()).padStart(2, '0');
            var s = String(d.getSeconds()).padStart(2, '0');
            return y + '-' + mo + '-' + day + ' ' + h + ':' + m + ':' + s;
        }

        function formatDuration(seconds) {
            if (!seconds) return '-';
            if (seconds < 60) return seconds + 's';
            var min = Math.floor(seconds / 60);
            var sec = seconds % 60;
            return min + 'm ' + sec + 's';
        }

        function formatTokens(n) {
            if (!n) return '-';
            return n.toLocaleString();
        }

        function isStale(job) {
            if (job.status !== 'Start') return false;
            var now = Math.floor(Date.now() / 1000);
            return (now - job.started_at) > 1800;
        }

        function addRow(container, label, valueNode, wide) {
            var row = document.createElement('div');
            row.className = 'detail-row' + (wide ? ' wide' : '');

            var labelDiv = document.createElement('div');
            labelDiv.className = 'detail-label';
            labelDiv.textContent = label;

            var valueDiv = document.createElement('div');
            valueDiv.className = 'detail-value';
            if (typeof valueNode === 'string') {
                valueDiv.textContent = valueNode;
            } else {
                valueDiv.appendChild(valueNode);
            }

            row.appendChild(labelDiv);
            row.appendChild(valueDiv);
            container.appendChild(row);
        }

        function addMonoRow(container, label, text) {
            var row = document.createElement('div');
            row.className = 'detail-row';

            var labelDiv = document.createElement('div');
            labelDiv.className = 'detail-label';
            labelDiv.textContent = label;

            var valueDiv = document.createElement('div');
            valueDiv.className = 'detail-value mono';
            valueDiv.textContent = text;

            row.appendChild(labelDiv);
            row.appendChild(valueDiv);
            container.appendChild(row);
        }

        function renderJob(job) {
            var wrapper = document.getElementById('jobDetail');
            wrapper.className = 'detail-card';
            wrapper.replaceChildren();

            // Header: title + status
            var header = document.createElement('div');
            header.className = 'detail-header';

            var title = document.createElement('div');
            title.className = 'detail-title';
            title.textContent = t('detail_title');
            header.appendChild(title);

            var statusSpan = document.createElement('span');
            statusSpan.className = 'status status-' + job.status.toLowerCase();
            statusSpan.textContent = t('status_' + job.status.toLowerCase());
            header.appendChild(statusSpan);

            if (isStale(job)) {
                var staleSpan = document.createElement('span');
                staleSpan.className = 'stale-badge';
                staleSpan.textContent = t('jobs_stale');
                header.appendChild(staleSpan);
            }

            wrapper.appendChild(header);

            // Rows: two columns, long values span both
            var grid = document.createElement('div');
            grid.className = 'detail-grid';
            wrapper.appendChild(grid);

            addMonoRow(grid, t('label_job_id'), job.job_id || '-');
            addMonoRow(grid, t('label_session_id'), job.session_id || '-');

            if (job.user_query) {
                var queryDiv = document.createElement('div');
                queryDiv.className = 'query-text';
                queryDiv.textContent = job.user_query;
                addRow(grid, t('label_query'), queryDiv, true);
            } else {
                addRow(grid, t('label_query'), '-', true);
            }

            addMonoRow(grid, t('label_started'), formatTime(job.started_at));
            addMonoRow(grid, t('label_completed'), formatTime(job.ended_at));
            addMonoRow(grid, t('label_duration'), formatDuration(job.elapsed_seconds));
            addMonoRow(grid, t('label_total_tokens'), formatTokens(job.total_tokens));
            addMonoRow(grid, t('label_input_tokens'), formatTokens(job.input_tokens));
            addMonoRow(grid, t('label_output_tokens'), formatTokens(job.output_tokens));
            addMonoRow(grid, t('label_cache_read'), formatTokens(job.cache_read_input_tokens));
            addMonoRow(grid, t('label_cache_write'), formatTokens(job.cache_creation_input_tokens));
            addMonoRow(grid, t('label_cache_hit'), job.cache_hit_rate != null ? job.cache_hit_rate + '%' : '-');

            // Report file (with download link if session_id exists)
            if (job.report_filename && job.session_id) {
                var link = document.createElement('a');
                link.className = 'report-link';
                link.textContent = job.report_filename;
                link.href = fileUrl('artifacts', job.report_filename, true);
                addRow(grid, t('label_report'), link);
            } else {
                addMonoRow(grid, t('label_report'), job.report_filename || '-');
            }

            // Error (if failed)
            if (job.error_message) {
                var errorSpan = document.createElement('span');
                errorSpan.className = 'error-text';
                errorSpan.textContent = job.error_message;
                addRow(grid, t('label_error'), errorSpan, true);
            }
        }

        // ---------- Files ----------

        var IMAGE_EXT = ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg'];
        var RESULT_EXT = ['.docx', '.pdf', '.pptx', '.xlsx'];
        var currentFiles = null;
        var currentTrace = null;

        function jobId() {
            var parts = window.location.pathname.split('/');
            return parts[parts.length - 1];
        }

        function fileUrl(area, name, download) {
            var path = name.split('/').map(encodeURIComponent).join('/');
            return '/admin/api/jobs/' + encodeURIComponent(jobId()) + '/files/' + area + '/' + path +
                (download ? '?download=true' : '');
        }

        function isImage(name) {
            var lower = name.toLowerCase();
            return IMAGE_EXT.some(function(ext) { return lower.endsWith(ext); });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function sectionShell(container, titleKey, metaText) {
            container.className = 'section';
            container.replaceChildren();
            var header = el('div', 'section-header');
            var left = el('div');
            left.appendChild(el('div', 'section-title', t(titleKey)));
            if (metaText) left.appendChild(el('div', 'section-meta', metaText));
            header.appendChild(left);
            container.appendChild(header);
            return header;
        }

        function renderFileList(container, area, files) {
            if (!files.length) {
                container.appendChild(el('div', 'section-empty', t('files_none')));
                return;
            }
            files.forEach(function(f) {
                var row = el('div', 'file-row');
                var link = el('a', 'report-link', f.name);
                link.href = fileUrl(area, f.name, true);
                row.appendChild(link);
                row.appendChild(el('span', 'file-size', formatSize(f.size)));
                container.appendChild(row);
            });
        }

        function renderFiles() {
            var container = document.getElementById('filesSection');
            if (!currentFiles) return;
            if (currentFiles.error) {
                sectionShell(container, 'files_title');
                container.appendChild(el('div', 'section-empty', t('files_load_error')));
                return;
            }
            var header = sectionShell(container, 'files_title');
            // Same pick as the Lambda (first .docx); jobs recorded before their
            // artifacts reached S3 have no report_filename
            var docx = currentFiles.artifacts.find(function(f) { return f.name.toLowerCase().endsWith('.docx'); });
            var report = (currentJob && currentJob.report_filename) || (docx && docx.name);
            if (report) {
                var btn = el('a', 'btn-primary', t('files_download_report'));
                btn.href = fileUrl('artifacts', report, true);
                header.appendChild(btn);
            }

            var artifacts = currentFiles.artifacts;

            // 1. Input data
            container.appendChild(el('div', 'subsection-title', t('files_input') + ' (' + currentFiles.input.length + ')'));
            renderFileList(container, 'input', currentFiles.input);

            // 2. Result files: documents, the job's report first
            var results = artifacts.filter(function(f) { return RESULT_EXT.some(function(ext) { return f.name.toLowerCase().endsWith(ext); }); });
            results.sort(function(a, b) { return (b.name === report) - (a.name === report); });
            container.appendChild(el('div', 'subsection-title', t('files_results') + ' (' + results.length + ')'));
            if (results.length) {
                var cards = el('div', 'result-grid');
                results.forEach(function(f) {
                    var card = el('a', 'result-card' + (f.name === report ? ' primary' : ''));
                    card.href = fileUrl('artifacts', f.name, true);
                    card.title = f.name;
                    card.appendChild(el('span', 'result-icon', f.name.split('.').pop().toUpperCase()));
                    var meta = el('span', 'result-meta');
                    meta.appendChild(el('span', 'result-name', f.name));
                    meta.appendChild(el('span', 'file-size', formatSize(f.size) + (f.name === report ? ' · ' + t('files_report_badge') : '')));
                    card.appendChild(meta);
                    cards.appendChild(card);
                });
                container.appendChild(cards);
            } else {
                container.appendChild(el('div', 'section-empty', t('files_none')));
            }

            // 3. Images: charts are saved as .png and .svg; show one per chart
            var names = {};
            artifacts.forEach(function(f) { names[f.name] = true; });
            var images = artifacts.filter(function(f) {
                if (!isImage(f.name)) return false;
                return !(f.name.toLowerCase().endsWith('.svg') && names[f.name.replace(/\.svg$/i, '.png')]);
            });
            container.appendChild(el('div', 'subsection-title', t('files_images') + ' (' + images.length + ')'));
            if (images.length) {
                var grid = el('div', 'image-grid');
                images.forEach(function(f) {
                    var tile = el('a', 'image-tile');
                    tile.href = fileUrl('artifacts', f.name, false);
                    tile.target = '_blank';
                    tile.rel = 'noopener';
                    var img = el('img');
                    img.src = tile.href;
                    img.loading = 'lazy';
                    img.alt = f.name;
                    tile.appendChild(img);
                    tile.appendChild(el('span', null, f.name));
                    grid.appendChild(tile);
                });
                container.appendChild(grid);
            } else {
                container.appendChild(el('div', 'section-empty', t('files_none')));
            }

            // 4. Every generated file (code, cache, intermediate results), collapsed
            var all = el('details', 'all-files');
            all.appendChild(el('summary', 'subsection-title', t('files_all') + ' (' + artifacts.length + ')'));
            renderFileList(all, 'artifacts', artifacts);
            container.appendChild(all);
        }

        async function fetchFiles(quiet) {
            var container = document.getElementById('filesSection');
            if (!quiet) {
                sectionShell(container, 'files_title');
                container.appendChild(el('div', 'section-empty', t('files_loading')));
            }
            try {
                var res = await fetch('/admin/api/jobs/' + encodeURIComponent(jobId()) + '/files');
                var data = await res.json();
                currentFiles = data.success ? data : { error: true };
            } catch (e) {
                currentFiles = { error: true };
            }
            renderFiles();
        }

        // ---------- Agent trace ----------
        // Rendered by trace-view.js; traceState keeps the selected and collapsed
        // nodes across the refreshes of a running job.
        var traceState = {};

        function renderTrace() {
            var container = document.getElementById('traceSection');
            if (!currentTrace) return;
            sectionShell(container, 'trace_title', currentTrace.available && isRunning() ? t('trace_auto_refresh') : null);
            if (currentTrace.error) {
                container.appendChild(el('div', 'section-empty', t('trace_load_error')));
                return;
            }
            if (!currentTrace.available) {
                container.appendChild(el('div', 'section-empty', t('trace_unavailable')));
                return;
            }
            TraceView.render(container, currentTrace.records, { job: currentJob, running: isRunning(), state: traceState });
        }

        async function fetchTrace(quiet) {
            var container = document.getElementById('traceSection');
            if (!quiet) {
                sectionShell(container, 'trace_title');
                container.appendChild(el('div', 'section-empty', t('trace_loading')));
            }
            try {
                var res = await fetch('/admin/api/jobs/' + encodeURIComponent(jobId()) + '/trace');
                var data = await res.json();
                currentTrace = data.success ? data : { error: true };
            } catch (e) {
                currentTrace = { error: true };
            }
            renderTrace();
        }

        // A running job refreshes itself: the runtime re-uploads the trace as it goes
        var REFRESH_MS = 15000;

        function isRunning() {
            return !!currentJob && currentJob.status === 'Start';
        }

        async function loadJob(quiet) {
            try {
                var res = await fetch('/admin/api/jobs/' + encodeURIComponent(jobId()));
                if (res.status === 401) {
                    window.location.href = '/admin/login';
                    return false;
                }
                var data = await res.json();
                if (data.success) {
                    currentJob = data.job;
                    renderJob(currentJob);
                    document.title = 'Deep Insight — Job ' + (currentJob.status || '');
                    return true;
                }
                if (!quiet) {
                    var wrapper = document.getElementById('jobDetail');
                    wrapper.className = 'loading';
                    wrapper.textContent = data.error || t('detail_not_found');
                }
            } catch (e) {
                if (!quiet) {
                    var wrapper = document.getElementById('jobDetail');
                    wrapper.className = 'loading';
                    wrapper.textContent = t('detail_load_error');
                }
            }
            return false;
        }

        function scheduleRefresh() {
            if (isRunning()) setTimeout(refreshRunning, REFRESH_MS);
        }

        async function refreshRunning() {
            if (await loadJob(true)) await Promise.all([fetchFiles(true), fetchTrace(true)]);
            scheduleRefresh();
        }

        async function fetchJob() {
            if (!(await loadJob(false))) return;
            await Promise.all([fetchFiles(), fetchTrace()]);
            scheduleRefresh();
        }

        async function handleLogout() {
            await fetch('/admin/logout', { method: 'POST' });
            window.location.href = '/admin/login';
        }

        // Re-render detail when language changes
        function onLangChange() {
            if (currentJob) renderJob(currentJob);
            renderFiles();
            renderTrace();
        }

        applyAdminLang();
        fetchJob();
    </script>
</body>
</html>
